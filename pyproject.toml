[project]
name = "gs-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "japanize-matplotlib>=1.1.3",
    "laspy>=2.7.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "opencv-python>=4.10.0",
    "open3d>=0.19.0",
    "plyfile>=1.1.3",
    "pyransac3d>=0.6.0",
    "python-dotenv>=1.1.0",
    "requests>=2.32.0",
    "scikit-learn>=1.8.0",
    "viser>=1.0.24",
]

[project.scripts]
gs-classifier = "gs_classifier.cli:main"

[tool.uv]
package = true

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = ["I", "D"]
ignore = ["D415"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # assert文の使用を許可
    "PLR2004",  # マジックナンバーの使用を許可
    "D",        # Docstringの強制を解除
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.5",
]
